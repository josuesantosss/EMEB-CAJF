<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Gestão Completa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 { color: #2d3748; font-size: 2em; }
        .login-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 450px;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn {
            padding: 14px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        .btn:hover { background: #5a67d8; }
        .dashboard {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .dashboard.active { display: block; }
        .hidden { display: none !important; }
        .section-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
        }
        .turmas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .turma-item {
            background: #edf2f7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .turma-item:hover { background: #e2e8f0; }
        .turma-item.selected { border-color: #667eea; background: #ebf4ff; }
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        table th { background: #667eea; color: white; padding: 12px; text-align: left; }
        table td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .nota-input {
            width: 60px;
            padding: 5px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            text-align: center;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active { display: flex; }
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3>🔄 Carregando dados...</h3>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏫 Sistema de Gestão Escolar</h1>
        </div>

        <div id="loginContainer" class="login-container">
            <h2>🔐 Acesso ao Sistema</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Cargo</label>
                    <select id="cargo" required>
                        <option value="">-- Escolha --</option>
                        <option value="direcao">👔 Direção</option>
                        <option value="coordenacao">📚 Coordenação</option>
                        <option value="professor">👨‍🏫 Professor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>

        <div id="dashboard" class="dashboard">
            <h2 id="dashboardTitle">📊 Painel</h2>
            <p id="userDisplay"></p>
            <button onclick="logout()" class="btn" style="width: auto; margin: 10px 0;">🚪 Sair</button>
            
            <div id="turmasSection" class="hidden">
                <h3>📚 Minhas Turmas</h3>
                <div id="turmasContainer" class="turmas-grid"></div>
            </div>

            <div id="notasSection" class="hidden">
                <div class="section-container">
                    <h3>📝 Notas: <span id="turmaSelecionadaNome">-</span></h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Aluno</th>
                                    <th>1º Bim</th>
                                    <th>2º Bim</th>
                                    <th>3º Bim</th>
                                    <th>4º Bim</th>
                                    <th>Média</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaNotasBody"></tbody>
                        </table>
                    </div>
                    <button onclick="salvarNotas()" class="btn" style="width: auto; margin-top: 10px;">💾 Salvar Notas</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const API_CONFIG = {
            url: 'https://script.google.com/macros/s/AKfycbwNOBi4UyfTxwTYltbqi9HLCqZjbZ96nxjPXwqUeQbMi3YOQ5MLlDlyXEZFlrGycTRr/exec'
        };

        // ============================================
        // FUNÇÃO JSONP PARA CHAMAR A API
        // ============================================
        function chamarAPI(acao, dados = {}) {
            return new Promise((resolve, reject) => {
                const callbackName = 'callback_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                
                window[callbackName] = function(resultado) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    
                    if (resultado && resultado.success) {
                        resolve(resultado);
                    } else {
                        reject(new Error(resultado?.error || 'Erro desconhecido'));
                    }
                };
                
                const script = document.createElement('script');
                const params = new URLSearchParams({
                    acao: acao,
                    dados: JSON.stringify(dados),
                    callback: callbackName
                });
                
                script.src = `${API_CONFIG.url}?${params.toString()}`;
                script.onerror = function() {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error('Falha ao carregar API'));
                };
                
                document.body.appendChild(script);
                
                setTimeout(() => {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        document.body.removeChild(script);
                        reject(new Error('Timeout'));
                    }
                }, 30000);
            });
        }

        // ============================================
        // DADOS LOCAIS
        // ============================================
        let escolaData = {
            turmas: [],
            alunos: {},
            professores: []
        };
        
        let db = {
            atribuicoes: {},
            notas: {}
        };
        
        let currentUser = { cargo: '', nome: '', turmas: [] };
        let turmaSelecionada = null;

        // ============================================
        // CARREGAR DADOS
        // ============================================
        async function carregarDados() {
            const loading = document.getElementById('loadingOverlay');
            loading.classList.add('active');
            
            try {
                console.log('📡 Carregando dados via JSONP...');
                
                const resultado = await chamarAPI('lerTodasAbas');
                
                if (resultado.success && resultado.dados) {
                    processarDados(resultado.dados);
                    console.log('✅ Dados carregados!');
                }
            } catch (error) {
                console.error('❌ Erro:', error);
                alert('Erro ao carregar: ' + error.message);
            } finally {
                loading.classList.remove('active');
            }
        }

        // ============================================
        // PROCESSAR DADOS
        // ============================================
        function processarDados(dadosAPI) {
            // Processa alunos
            if (dadosAPI.TURMAS_ALUNOS && dadosAPI.TURMAS_ALUNOS.dados) {
                const novosAlunos = {};
                
                dadosAPI.TURMAS_ALUNOS.dados.forEach(aluno => {
                    const turma = String(aluno.Turma || '').trim();
                    const nome = String(aluno.Nome_Aluno || aluno.Nome || '').trim();
                    
                    if (turma && nome) {
                        if (!novosAlunos[turma]) novosAlunos[turma] = [];
                        if (!novosAlunos[turma].includes(nome)) {
                            novosAlunos[turma].push(nome);
                        }
                    }
                });
                
                escolaData.alunos = novosAlunos;
                escolaData.turmas = Object.keys(novosAlunos);
            }
            
            // Processa professores
            if (dadosAPI.PROFESSORES && dadosAPI.PROFESSORES.dados) {
                escolaData.professores = dadosAPI.PROFESSORES.dados.map(p => ({
                    id: String(p.ID_Professor || ''),
                    nome: String(p.Nome || ''),
                    tipo: String(p.Tipo || '')
                }));
            }
            
            // Processa atribuições
            if (dadosAPI.ATRIBUICOES && dadosAPI.ATRIBUICOES.dados) {
                const novasAtribuicoes = {};
                
                dadosAPI.ATRIBUICOES.dados.forEach(attr => {
                    const profId = String(attr.ID_Professor || '');
                    const turma = String(attr.Turma || '').trim();
                    
                    if (profId && turma) {
                        if (!novasAtribuicoes[profId]) novasAtribuicoes[profId] = [];
                        if (!novasAtribuicoes[profId].includes(turma)) {
                            novasAtribuicoes[profId].push(turma);
                        }
                    }
                });
                
                db.atribuicoes = novasAtribuicoes;
            }
            
            // Processa notas
            if (dadosAPI.NOTAS_BIMESTRAIS && dadosAPI.NOTAS_BIMESTRAIS.dados) {
                db.notas = {};
                
                dadosAPI.NOTAS_BIMESTRAIS.dados.forEach(nota => {
                    const turma = String(nota.Turma || '').trim();
                    const aluno = String(nota.Nome_Aluno || nota.Aluno || '').trim();
                    const bimestre = parseInt(nota.Bimestre) || 1;
                    const valor = parseFloat(nota.Nota) || 0;
                    
                    if (turma && aluno) {
                        if (!db.notas[turma]) db.notas[turma] = {};
                        if (!db.notas[turma][aluno]) db.notas[turma][aluno] = {1:0, 2:0, 3:0, 4:0};
                        if (bimestre >= 1 && bimestre <= 4) {
                            db.notas[turma][aluno][bimestre] = valor;
                        }
                    }
                });
            }
            
            console.log('✅ Dados processados:', {
                turmas: escolaData.turmas.length,
                professores: escolaData.professores.length
            });
        }

        // ============================================
        // LOGIN
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const cargo = document.getElementById('cargo').value;
            const nome = document.getElementById('nome').value.trim();
            
            if (!cargo || !nome) {
                alert('Preencha todos os campos.');
                return;
            }
            
            currentUser.cargo = cargo;
            currentUser.nome = nome;
            
            if (cargo === 'professor') {
                const prof = escolaData.professores.find(p => 
                    p.nome.toLowerCase().includes(nome.toLowerCase())
                );
                
                if (prof) {
                    currentUser.turmas = db.atribuicoes[prof.id] || [];
                } else {
                    // Para teste, atribui todas as turmas
                    currentUser.turmas = escolaData.turmas;
                }
            }
            
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('dashboardTitle').textContent = `📊 Painel - ${cargo}`;
            document.getElementById('userDisplay').textContent = `👤 ${nome}`;
            
            if (cargo === 'professor' && currentUser.turmas.length > 0) {
                document.getElementById('turmasSection').classList.remove('hidden');
                renderTurmas();
            }
        });

        // ============================================
        // RENDERIZAR TURMAS
        // ============================================
        function renderTurmas() {
            const container = document.getElementById('turmasContainer');
            
            container.innerHTML = currentUser.turmas.map(turma => `
                <div class="turma-item" onclick="selecionarTurma('${turma}')">
                    ${turma}
                </div>
            `).join('');
        }

        // ============================================
        // SELECIONAR TURMA
        // ============================================
        function selecionarTurma(turma) {
            turmaSelecionada = turma;
            document.getElementById('turmaSelecionadaNome').textContent = turma;
            document.getElementById('notasSection').classList.remove('hidden');
            carregarTabelaNotas();
        }

        // ============================================
        // CARREGAR TABELA DE NOTAS
        // ============================================
        function carregarTabelaNotas() {
            if (!turmaSelecionada) return;
            
            const alunos = escolaData.alunos[turmaSelecionada] || [];
            const tbody = document.getElementById('tabelaNotasBody');
            
            if (alunos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Nenhum aluno</td></tr>';
                return;
            }
            
            tbody.innerHTML = alunos.map(aluno => {
                const notas = (db.notas[turmaSelecionada] && db.notas[turmaSelecionada][aluno]) || {1:0, 2:0, 3:0, 4:0};
                const media = (notas[1] + notas[2] + notas[3] + notas[4]) / 4;
                const alunoId = aluno.replace(/\s/g, '_');
                
                return `
                    <tr>
                        <td>${aluno}</td>
                        <td><input type="number" class="nota-input" id="nota_${alunoId}_1" value="${notas[1]}"></td>
                        <td><input type="number" class="nota-input" id="nota_${alunoId}_2" value="${notas[2]}"></td>
                        <td><input type="number" class="nota-input" id="nota_${alunoId}_3" value="${notas[3]}"></td>
                        <td><input type="number" class="nota-input" id="nota_${alunoId}_4" value="${notas[4]}"></td>
                        <td>${media.toFixed(1)}</td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // SALVAR NOTAS
        // ============================================
        async function salvarNotas() {
            if (!turmaSelecionada) {
                alert('Selecione uma turma.');
                return;
            }
            
            const alunos = escolaData.alunos[turmaSelecionada] || [];
            const notasParaSalvar = [];
            
            alunos.forEach(aluno => {
                const alunoId = aluno.replace(/\s/g, '_');
                
                for (let bim = 1; bim <= 4; bim++) {
                    const input = document.getElementById(`nota_${alunoId}_${bim}`);
                    if (input) {
                        notasParaSalvar.push({
                            aluno: aluno,
                            bimestre: bim,
                            nota: parseFloat(input.value) || 0,
                            disciplina: 'GERAL'
                        });
                    }
                }
            });
            
            try {
                const resultado = await chamarAPI('salvarNotas', {
                    turma: turmaSelecionada,
                    notas: notasParaSalvar,
                    professor: currentUser.nome,
                    anoLetivo: '2026'
                });
                
                alert('✅ ' + (resultado.mensagem || 'Notas salvas!'));
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        }

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('loginForm').reset();
            document.getElementById('turmasSection').classList.add('hidden');
            document.getElementById('notasSection').classList.add('hidden');
            turmaSelecionada = null;
            currentUser = { cargo: '', nome: '', turmas: [] };
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Sistema iniciado');
            carregarDados();
        });
    </script>
</body>
</html>
